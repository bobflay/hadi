<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --cell: #334155;
      --cell-hover: #475569;
      --x-color: #38bdf8;
      --o-color: #fb7185;
      --text: #e2e8f0;
      --accent: #a78bfa;
      --win: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .status {
      font-size: 1.1rem;
      min-height: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 96px);
      grid-template-rows: repeat(3, 96px);
      gap: 10px;
      background: var(--panel);
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 700;
      background: var(--cell);
      border: none;
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .cell:hover:not(:disabled) { background: var(--cell-hover); }
    .cell:active:not(:disabled) { transform: scale(0.95); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--x-color); }
    .cell.o { color: var(--o-color); }
    .cell.win { background: var(--win); color: #fff; }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button.reset {
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #1e1b4b;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    button.reset:hover { opacity: 0.85; }

    .scoreboard {
      display: flex;
      gap: 24px;
      font-size: 0.95rem;
    }

    .scoreboard span { font-weight: 700; }
    .scoreboard .x-score { color: var(--x-color); }
    .scoreboard .o-score { color: var(--o-color); }
  </style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div class="status" id="status">Player X's turn</div>

  <div class="board" id="board"></div>

  <div class="scoreboard">
    <div>X wins: <span class="x-score" id="xScore">0</span></div>
    <div>Draws: <span id="drawScore">0</span></div>
    <div>O wins: <span class="o-score" id="oScore">0</span></div>
  </div>

  <div class="controls">
    <button class="reset" id="reset">New Game</button>
  </div>

  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const resetBtn = document.getElementById("reset");
    const xScoreEl = document.getElementById("xScore");
    const oScoreEl = document.getElementById("oScore");
    const drawScoreEl = document.getElementById("drawScore");

    const WINNING_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board, currentPlayer, gameOver;
    const scores = { X: 0, O: 0, draw: 0 };

    function init() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      statusEl.textContent = "Player X's turn";
      boardEl.innerHTML = "";
      board.forEach((_, i) => {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", handleMove);
        boardEl.appendChild(cell);
      });
    }

    function handleMove(e) {
      const index = Number(e.currentTarget.dataset.index);
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;
      const cell = e.currentTarget;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());
      cell.disabled = true;

      const winningLine = getWinningLine();
      if (winningLine) {
        endGame(currentPlayer, winningLine);
      } else if (board.every(Boolean)) {
        endGame(null);
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusEl.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function getWinningLine() {
      return WINNING_LINES.find(
        ([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]
      );
    }

    function endGame(winner, line) {
      gameOver = true;
      const cells = boardEl.children;
      for (const cell of cells) cell.disabled = true;

      if (winner) {
        line.forEach(i => cells[i].classList.add("win"));
        statusEl.textContent = `Player ${winner} wins! 🎉`;
        scores[winner]++;
        (winner === "X" ? xScoreEl : oScoreEl).textContent = scores[winner];
      } else {
        statusEl.textContent = "It's a draw!";
        scores.draw++;
        drawScoreEl.textContent = scores.draw;
      }
    }

    resetBtn.addEventListener("click", init);
    init();
  </script>
</body>
</html>
